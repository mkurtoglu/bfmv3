# Built-in defaults. Put site settings in /etc/bfm/watcher.yml and start with
#   java -jar bfm-watcher.jar --spring.config.additional-location=/etc/bfm/watcher.yml
server:
  port: 8443
  servlet:
    session:
      timeout: 30m
spring:
  application:
    name: bfm-watcher
  main:
    banner-mode: off
vaadin:
  launch-browser: false
  allowed-packages: com.vaadin,com.bisoft.bfm
logging:
  level:
    org.apache.ratis: WARN
    org.atmosphere: WARN
