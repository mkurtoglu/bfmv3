# Tests, then every package (docs/build-packages.md): RPM for Rocky / RHEL 8, 9, 10 and DEB for Ubuntu 22.04,
# 24.04, 26.04, all built in Rocky Linux 9.7 with the packages packaging/Containerfile.build installs. Needs a Runner
# with the Docker executor.

variables:
  CI_BUILD_IMAGE: "docker.io/rockylinux/rockylinux:9.7"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B --no-transfer-progress"

default:
  image: $CI_BUILD_IMAGE
  before_script:
    - dnf -y -q module enable maven:3.9
    - dnf -y -q install --setopt=install_weak_deps=False java-21-openjdk-devel maven-openjdk21 rpm-build git tar xz gzip findutils
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    fallback_keys:
      - maven-$CI_DEFAULT_BRANCH
    paths:
      - .m2/repository

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - test
  - package

test:
  stage: test
  script:
    - mvn $MAVEN_CLI_OPTS verify
  artifacts:
    when: always
    reports:
      junit:
        - "*/target/surefire-reports/TEST-*.xml"
    expire_in: 7 days

packages:
  stage: package
  needs: [test]
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    - packaging/build.sh
  artifacts:
    name: "bfm-packages-$CI_COMMIT_SHORT_SHA"
    paths:
      - target/packages/
    expire_in: 30 days

packages-release:
  extends: packages
  rules:
    - if: $CI_COMMIT_TAG
  artifacts:
    name: "bfm-packages-$CI_COMMIT_TAG"
    paths:
      - target/packages/
    expire_in: never
