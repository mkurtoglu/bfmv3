# Built-in defaults. Put site settings in /etc/pgvip/watcher.yml and start with
#   java -jar pgvip-watcher.jar --spring.config.additional-location=/etc/pgvip/watcher.yml
server:
  port: 8443
  servlet:
    session:
      timeout: 30m
spring:
  application:
    name: pgvip-watcher
  main:
    banner-mode: off
vaadin:
  launch-browser: false
  allowed-packages: com.vaadin,io.pgvip
logging:
  level:
    org.apache.ratis: WARN
    org.atmosphere: WARN
